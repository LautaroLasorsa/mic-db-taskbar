[package]
name = "mic-db-taskbar"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Live microphone level (dBFS) for every capture device, shown on the Windows 11 taskbar next to the Widgets button"
license = "MIT"
repository = "https://github.com/LautaroLasorsa/mic-db-taskbar"
readme = "README.md"
keywords = ["windows", "microphone", "taskbar", "wasapi", "meter"]
categories = ["multimedia::audio"]

[profile.release]
lto = true
codegen-units = 1
strip = true

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Media_Audio", "Win32_Media_KernelStreaming", "Win32_Media_Multimedia", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_UI_Shell_PropertiesSystem", "Win32_Devices_FunctionDiscovery", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_Graphics_Gdi", "Win32_UI_Accessibility", "Win32_System_Registry", "Win32_System_LibraryLoader", "Win32_System_Console", "Win32_Security", "Win32_System_Ole"] }
